<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="weather-form" action="">
        <input id="city-input" type="text" placeholder="Enter a City Name" required>
        <button type="submit" onclick="">Get Weather</button>
    </form>
    <div id="weather-card" class="weather-card" style="display:none">
        <h1 id="city-name" class="city-name"></h1>
        <p id="temperature" class="temperature"></p>
        <p id="humidity" class="humidity"></p>
        <p id="desc" class="desc"></p>
        <p id="emoji" class="emoji"></p>
        <p id="error" class="error"></p>
    </div>  

    <script src="index.js"></script>
</body>
</html>
